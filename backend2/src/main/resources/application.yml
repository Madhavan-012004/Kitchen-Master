server:
  port: 8080
  address: 0.0.0.0

# ─────────────────────────────────────────────────
# Default profile (development) — uses cloud PostgreSQL
# ─────────────────────────────────────────────────
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:kitchen_master_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 16MB

app:
  jwt:
    secret: ${JWT_SECRET:kitchen_master_super_secret_jwt_key_2024}
    expiration: 2592000000   # 30 days in ms
  gemini:
    api-key: ${GEMINI_API_KEY:AIzaSyCBd_MdqR-3qIYgDt2iD3XnzyeyBtt11hA}
    model: ${GEMINI_MODEL:gemini-1.5-flash}
    api-url: https://generativelanguage.googleapis.com/v1beta/models
  upload:
    path: ${UPLOAD_PATH:./uploads}
    max-size: 15728640   # 15MB

logging:
  level:
    com.probloom: DEBUG
    org.springframework.security: WARN

---
# ─────────────────────────────────────────────────
# Standalone profile — activated by Electron EXE
# Manages BOTH offline (embedded PG) and online (cloud PG) datasources.
# DataSourceConfig.java wires both; DualRoutingDataSource switches at runtime.
# ─────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: standalone
    import: optional:file:.env[.properties]
  # JPA settings — datasource URL is managed dynamically by DataSourceConfig.java
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  # Auto-config for datasource is OFF — we build it manually in DataSourceConfig
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 16MB
