<!DOCTYPE html>
<html>
<head>
    <title>ProBloom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        .logo-container {
            margin-bottom: 2rem;
            animation: pulse 2s infinite ease-in-out;
        }
        .logo {
            width: 120px;
            height: 120px;
            border-radius: 20%;
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.4);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }
        .subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }
        .loader-bar {
            width: 250px;
            height: 4px;
            background: #1e293b;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .loader-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .status-text {
            margin-top: 1rem;
            font-size: 0.8rem;
            color: #64748b;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
    </style>
</head>
<body>
    <div class="logo-container">
        <img src="logo.jpeg" class="logo" alt="Logo" />
    </div>
    <div class="title">ProBloom</div>
    <div class="subtitle">Premium Billing & Inventory System</div>
    
    <div class="loader-bar">
        <div id="progress" class="loader-progress"></div>
    </div>
    <div id="status" class="status-text">Starting backend services...</div>

    <script>
        const { ipcRenderer } = require('electron');
        const progressEl = document.getElementById('progress');
        const statusEl = document.getElementById('status');

        ipcRenderer.on('status-update', (event, { status, progress }) => {
            statusEl.innerText = status;
            progressEl.style.width = progress + '%';
        });
    </script>
</body>
</html>
