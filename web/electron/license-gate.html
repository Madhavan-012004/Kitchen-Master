<!DOCTYPE html>
<html>
<head>
    <title>License Required - ProBloom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            width: 450px;
            text-align: center;
            border: 1px solid #334155;
        }
        h2 { margin-top: 0; color: #f8fafc; }
        p { color: #94a3b8; line-height: 1.5; font-size: 0.95rem; }
        
        .hw-id-container {
            background: #0f172a;
            padding: 1rem;
            border-radius: 0.5rem;
            margin: 1.5rem 0;
            border: 1px dashed #475569;
            user-select: all;
            cursor: pointer;
        }
        .hw-id-label { font-size: 0.7rem; color: #6366f1; text-transform: uppercase; font-weight: bold; margin-bottom: 0.4rem; }
        .hw-id-value { font-family: monospace; font-size: 1.2rem; color: #e2e8f0; }

        .drop-zone {
            border: 2px dashed #334155;
            border-radius: 0.5rem;
            padding: 2rem;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }
        .drop-zone:hover, .drop-zone.dragover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }
        .drop-zone-text { font-size: 0.9rem; color: #94a3b8; }
        .drop-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; display: block; }
        
        #file-input { display: none; }
        
        .btn-primary {
            background: #6366f1;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 0.4rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }
        .error-msg { color: #ef4444; font-size: 0.85rem; margin-top: 1rem; display: none; }
        .success-msg { color: #10b981; font-size: 0.85rem; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>License Required</h2>
        <p>This machine is not activated for offline use. Please send your Hardware ID to <b>support@probloom.in</b> to receive your license file.</p>
        
        <div class="hw-id-container" title="Click to copy" onclick="copyHwId()">
            <div class="hw-id-label">Machine Hardware ID</div>
            <div id="hw-id" class="hw-id-value">FETCHING...</div>
        </div>

        <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
            <span class="drop-zone-icon">📄</span>
            <span class="drop-zone-text">Click to select or drag & drop <b>.lic</b> file here</span>
            <input type="file" id="file-input" accept=".lic">
        </div>
        
        <div id="error" class="error-msg"></div>
        <div id="success" class="success-msg">License activated! Restarting...</div>
        
        <button class="btn-primary" onclick="window.location.reload()">Refresh Status</button>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        
        ipcRenderer.on('hw-id', (event, id) => {
            document.getElementById('hw-id').innerText = id;
        });

        function copyHwId() {
            const id = document.getElementById('hw-id').innerText;
            navigator.clipboard.writeText(id);
            alert('Hardware ID copied to clipboard!');
        }

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');

        ['dragover', 'dragleave', 'drop'].forEach(evt => {
            dropZone.addEventListener(evt, e => {
                e.preventDefault();
                e.stopPropagation();
            });
        });

        dropZone.addEventListener('dragover', () => dropZone.classList.add('dragover'));
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            dropZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        });

        async function handleFile(file) {
            if (!file.name.endsWith('.lic')) {
                showError('Invalid file type. Please upload a .lic file.');
                return;
            }

            errorEl.style.display = 'none';
            
            // Send file path to main process to handle upload via backend API
            ipcRenderer.send('upload-license', file.path);
        }

        ipcRenderer.on('upload-error', (event, msg) => showError(msg));
        ipcRenderer.on('upload-success', () => {
            successEl.style.display = 'block';
            setTimeout(() => {
                ipcRenderer.send('license-activated');
            }, 1500);
        });

        function showError(msg) {
            errorEl.innerText = '⚠ ' + msg;
            errorEl.style.display = 'block';
        }
    </script>
</body>
</html>
