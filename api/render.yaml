databases:
  - name: probloom-db
    databaseName: kitchen_master_db
    user: probloom_user
    plan: free

services:
  - type: web
    name: probloom-backend
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DATABASE_URL
        fromDatabase:
          name: probloom-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        value: YOUR_GEMINI_API_KEY_HERE
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: UPLOAD_PATH
        value: ./uploads
    healthCheckPath: /actuator/health
    autoDeploy: true
